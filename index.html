<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Voice HD - Evaluation Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; color: #34495e; }
        #loginPage { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%); }
        .main-content { display: none; padding: 20px; }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .scoring-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 95%; max-width: 900px; max-height: 90vh; overflow-y: auto; }
        .audio-step-card { border-left: 4px solid #3498db; background: #f8f9fa; padding: 10px; margin-bottom: 8px; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="loginPage">
        <div class="card shadow p-4" style="width: 350px;">
            <h3 class="text-center mb-4">Dashboard Login</h3>
            <input type="password" id="adminPass" class="form-control mb-3" placeholder="รหัสผ่าน">
            <button id="loginBtn" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
        </div>
    </div>

    <div id="mainContent" class="main-content container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-headphones"></i> ระบบตรวจประเมินไฟล์เสียง (Voice HD)</h2>
            <button id="logoutBtn" class="btn btn-outline-danger">ออกจากระบบ</button>
        </div>

        <div class="table-container shadow-sm">
            <div class="row g-3 mb-4">
                <div class="col-md-3"><label class="small">วันที่เริ่มต้น</label><input type="date" id="startDate" class="form-control"></div>
                <div class="col-md-3"><label class="small">วันที่สิ้นสุด</label><input type="date" id="endDate" class="form-control"></div>
                <div class="col-md-2 d-flex align-items-end"><button id="filterBtn" class="btn btn-success w-100">ค้นหา</button></div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>วัน-เวลาเริ่มต้น</th>
                            <th>พนักงาน</th>
                            <th>กลุ่มงาน (TSR Group)</th>
                            <th>จำนวนข้อที่ส่ง</th>
                            <th>สถานะการประเมิน</th>
                            <th>การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="submissionTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="scoringModal" class="scoring-modal">
        <div class="modal-content shadow-lg">
            <div class="d-flex justify-content-between mb-3">
                <h4 class="fw-bold">ตรวจประเมิน: <span id="modalTraineeName" class="text-primary"></span></h4>
                <button class="btn-close" onclick="document.getElementById('scoringModal').style.display='none'"></button>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-5 border-end">
                    <h6 class="fw-bold mb-3 text-danger"><i class="bi bi-mic"></i> รายการเสียงที่บันทึกไว้</h6>
                    <!-- กล่องแสดงรายการเสียง -->
                    <div id="audioPlaylist" style="max-height: 450px; overflow-y: auto; padding-right: 10px;"></div>
                </div>
                <div class="col-md-7 ps-4">
                    <h6 class="fw-bold mb-3 text-success"><i class="bi bi-pencil-square"></i> บันทึกคะแนน</h6>
                    <div class="row g-3">
                        <div class="col-md-4"><label>คะแนน Part 1 (5)</label><input type="number" id="s1" class="form-control score-input"></div>
                        <div class="col-md-4"><label>คะแนน Part 2 (5)</label><input type="number" id="s2" class="form-control score-input"></div>
                        <div class="col-md-4"><label>คะแนน Part 3 (5)</label><input type="number" id="s3" class="form-control score-input"></div>
                        <div class="col-md-12"><label>ข้อเสนอแนะเพิ่มเติม</label><textarea id="feedback" class="form-control" rows="4"></textarea></div>
                    </div>
                    <div class="alert alert-secondary mt-3 text-center">
                        <h5 class="mb-0">คะแนนรวม: <span id="totalScore">0</span> / 15</h5>
                    </div>
                    <button id="saveScoreBtn" class="btn btn-primary w-100 mt-3 fw-bold">บันทึกผลการประเมิน</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // กรุณาใช้ URL และ Key ของ Supabase ให้ตรงกับหน้าทำแบบทดสอบ
        const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const VALID_PASS = '12345678';
        let rawData = [];
        let currentUserIdSession = null;

        // Login
        document.getElementById('loginBtn').onclick = () => {
            if (document.getElementById('adminPass').value === VALID_PASS) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                fetchSubmissions();
            } else { alert('รหัสผ่านไม่ถูกต้อง'); }
        };

        // --- ดึงข้อมูลจากตาราง voice_answers ---
        async function fetchSubmissions() {
            let query = supabase.from('voice_answers').select('*').order('created_at', { ascending: false });
            
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            if (start && end) { query = query.gte('created_at', start).lte('created_at', end + 'T23:59:59'); }

            const { data, error } = await query;
            if(error) {
                console.error("Error fetching data:", error);
                return;
            }
            rawData = data;

            // จัดกลุ่มตาม user_id เพื่อแสดง 1 แถวต่อพนักงาน 1 คน
            const grouped = data.reduce((acc, curr) => {
                const key = curr.user_id;
                if (!acc[key]) { 
                    acc[key] = curr; 
                    acc[key].audio_count = 0; // สร้างตัวนับจำนวนข้อ
                }
                // นับจำนวนไฟล์เสียงที่มี audio_url (ไม่นับแถวที่เก็บประวัติ SETUP)
                if(curr.audio_url) acc[key].audio_count += 1;
                return acc;
            }, {});

            const tbody = document.getElementById('submissionTable');
            tbody.innerHTML = '';

            Object.values(grouped).forEach(item => {
                const uid = item.user_id;
                tbody.innerHTML += `
                    <tr>
                        <td class="small">${new Date(item.created_at).toLocaleString('th-TH')}</td>
                        <td class="fw-bold text-primary">${item.exam_id}</td> <!-- exam_id เก็บชื่อพนักงาน -->
                        <td>${item.tsr_group_name || '-'}</td>
                        <td>${item.audio_count} ข้อ</td>
                        <td><span class="badge ${item.manual_score ? 'bg-success' : 'bg-warning text-dark'}">${item.manual_score || 'รอประเมิน'}</span></td>
                        <td><button class="btn btn-sm btn-primary" onclick="window.openEval('${uid}', '${item.exam_id}')">ประเมินเสียง</button></td>
                    </tr>`;
            });
        }

        // --- เปิด Modal และดึงเสียงทั้งหมดของพนักงานคนนั้น ---
        window.openEval = (userId, name) => {
            currentUserIdSession = userId;
            document.getElementById('modalTraineeName').textContent = name;
            document.getElementById('scoringModal').style.display = 'flex';
            
            // กรองข้อมูลเฉพาะของ User นี้ แล้วเรียงตาม Part และ ข้อ (question_number)
            const questionsList = rawData
                .filter(d => d.user_id === userId && d.audio_url != null)
                .sort((a, b) => {
                    if(a.part === b.part) return a.question_number - b.question_number;
                    return a.part.localeCompare(b.part);
                });
            
            const playlist = document.getElementById('audioPlaylist');
            playlist.innerHTML = '';
            
            if(questionsList.length === 0) {
                playlist.innerHTML = '<p class="text-muted">ไม่มีไฟล์เสียงสำหรับพนักงานคนนี้</p>';
            }

            questionsList.forEach(q => {
                const partName = q.part.replace('part', 'Part '); // แปลง part1 เป็น Part 1
                playlist.innerHTML += `
                    <div class="audio-step-card">
                        <div class="small fw-bold mb-1">${partName} : ข้อที่ ${q.question_number}</div>
                        <audio controls src="${q.audio_url}" class="w-100" style="height: 35px; outline: none;"></audio>
                    </div>`;
            });

            // ดึงคะแนนเดิมมาแสดง (ถ้ามี)
            const summary = questionsList.find(s => s.manual_score !== null) || rawData.find(d => d.user_id === userId);
            document.getElementById('s1').value = summary.s1_score || '';
            document.getElementById('s2').value = summary.s2_score || '';
            document.getElementById('s3').value = summary.s3_score || '';
            document.getElementById('feedback').value = summary.feedback || '';
            calculateTotal();
        };

        const calculateTotal = () => {
            const sum = ['s1','s2','s3'].reduce((acc, id) => acc + (parseInt(document.getElementById(id).value) || 0), 0);
            document.getElementById('totalScore').textContent = sum;
        };
        document.querySelectorAll('.score-input').forEach(i => i.oninput = calculateTotal);

        // --- บันทึกคะแนนกลับไปที่ตาราง voice_answers ---
        document.getElementById('saveScoreBtn').onclick = async () => {
            const total = document.getElementById('totalScore').textContent;
            const feedback = document.getElementById('feedback').value;
            
            // อัปเดตข้อมูลคะแนนทุกแถวที่เป็นของพนักงานคนนี้ (session เดียวกัน)
            const { error } = await supabase.from('voice_answers')
                .update({ 
                    manual_score: total, 
                    feedback: feedback,
                    s1_score: document.getElementById('s1').value,
                    s2_score: document.getElementById('s2').value,
                    s3_score: document.getElementById('s3').value
                })
                .match({ user_id: currentUserIdSession });

            if(!error) { 
                alert("✅ บันทึกคะแนนสำเร็จ"); 
                fetchSubmissions(); 
                document.getElementById('scoringModal').style.display='none'; 
            } else {
                alert("❌ เกิดข้อผิดพลาด: โปรดตรวจสอบว่าตาราง voice_answers มีคอลัมน์ manual_score, feedback, s1_score หรือไม่");
                console.error(error);
            }
        };

        document.getElementById('filterBtn').onclick = fetchSubmissions;
        document.getElementById('logoutBtn').onclick = () => location.reload();
    </script>
</body>
</html>
