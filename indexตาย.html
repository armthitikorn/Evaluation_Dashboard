<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ดึงข้อมูลไฟล์เสียง - Voice HD Submissions</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Sarabun', sans-serif; background:#f4f7f6; margin:0; padding:20px; color:#333; }
    .container { max-width: 1100px; margin: 0 auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.08); }
    h1 { color:#007bff; text-align:center; margin-top:0; }
    .config-box { border:1px solid #ddd; border-radius:8px; padding:15px; margin-bottom:20px; background:#f9f9f9; }
    .config-box label { display:block; font-weight:700; margin-bottom:5px; margin-top:10px; }
    .config-box input { width:100%; box-sizing:border-box; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:15px; }
    select, .btn { padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; border:1px solid #ccc; }
    .btn { border:none; color:#fff; font-weight:700; }
    .btn-primary { background:#007bff; }
    .btn-success { background:#28a745; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
    th, td { padding:8px 10px; border-bottom:1px solid #eee; text-align:left; vertical-align:middle; }
    th { background:#eef6ff; color:#007bff; position:sticky; top:0; }
    tr:hover { background:#f7fbff; }
    audio { max-width:220px; height:32px; }
    .status { font-weight:700; margin:10px 0; }
    .badge { padding:2px 8px; border-radius:10px; font-size:12px; color:#fff; }
    .badge.setup { background:#999; }
    .badge.answer { background:#28a745; }
    .small-link { font-size:13px; color:#007bff; text-decoration:none; }
    #tableWrap { max-height: 60vh; overflow:auto; border:1px solid #eee; border-radius:8px; }
</style>
</head>
<body>
<div class="container">
    <h1>📥 ดึงข้อมูลไฟล์เสียง (Voice HD Submissions)</h1>

    <div class="config-box">
        <label>Supabase URL</label>
        <input type="text" id="supaUrl" placeholder="https://xxxxxxxx.supabase.co" value="https://wzwyotzzxycqfwercakh.supabase.co">
        <label>Supabase anon/public Key</label>
        <input type="text" id="supaKey" placeholder="วางค่า anon key ที่นี่ (ค่าเดียวกับที่ใช้ในหน้าทำแบบทดสอบ)">
        <div style="margin-top:15px;">
            <button class="btn btn-primary" id="loadBtn" onclick="loadSubmissions()">โหลดรายการข้อมูล</button>
        </div>
    </div>

    <div id="statusMsg" class="status"></div>

    <div class="toolbar" id="toolbar" style="display:none;">
        <select id="groupFilter" onchange="renderTable()"><option value="">ทุกกลุ่ม</option></select>
        <select id="partFilter" onchange="renderTable()">
            <option value="">ทุก Part</option>
            <option value="1">Part 1</option>
            <option value="2">Part 2</option>
            <option value="3">Part 3</option>
        </select>
        <button class="btn btn-success" onclick="downloadAllZip()">ดาวน์โหลดทั้งหมดเป็น ZIP</button>
        <span id="countLabel" style="margin-left:auto; font-weight:700;"></span>
    </div>

    <div id="tableWrap">
        <table id="dataTable" style="display:none;">
            <thead>
                <tr>
                    <th>ชื่อ</th>
                    <th>กลุ่ม</th>
                    <th>Part/ข้อ</th>
                    <th>คำถาม</th>
                    <th>เสียง</th>
                    <th>ดาวน์โหลด</th>
                </tr>
            </thead>
            <tbody id="dataBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    import JSZip from 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';

    let allRows = [];
    let supabase = null;

    window.loadSubmissions = async function() {
        const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
        const statusMsg = document.getElementById('statusMsg');
        const loadBtn = document.getElementById('loadBtn');

        if (!url || !key) {
            statusMsg.textContent = '⚠️ กรุณากรอก Supabase URL และ Key ให้ครบ';
            return;
        }

        loadBtn.disabled = true;
        statusMsg.textContent = 'กำลังโหลดข้อมูล...';

        try {
            supabase = createClient(url, key);

            let from = 0;
            const pageSize = 1000;
            let rows = [];
            while (true) {
                const { data, error } = await supabase
                    .from('submissions')
                    .select('*')
                    .range(from, from + pageSize - 1)
                    .order('id', { ascending: true });
                if (error) throw error;
                if (!data || data.length === 0) break;
                rows = rows.concat(data);
                if (data.length < pageSize) break;
                from += pageSize;
            }

            allRows = rows.filter(r => r.audio_url); // เอาเฉพาะแถวที่มีไฟล์เสียงจริง

            statusMsg.textContent = `✅ โหลดสำเร็จ พบไฟล์เสียงทั้งหมด ${allRows.length} รายการ`;

            populateGroupFilter();
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('dataTable').style.display = 'table';
            renderTable();

        } catch (err) {
            console.error(err);
            statusMsg.textContent = '❌ โหลดข้อมูลไม่สำเร็จ: ' + err.message;
        } finally {
            loadBtn.disabled = false;
        }
    };

    function populateGroupFilter() {
        const sel = document.getElementById('groupFilter');
        const groups = [...new Set(allRows.map(r => r.user_group).filter(Boolean))];
        sel.innerHTML = '<option value="">ทุกกลุ่ม</option>' +
            groups.map(g => `<option value="${g}">${g}</option>`).join('');
    }

    window.renderTable = function() {
        const groupVal = document.getElementById('groupFilter').value;
        const partVal = document.getElementById('partFilter').value;

        const filtered = allRows.filter(r => {
            const groupOk = !groupVal || r.user_group === groupVal;
            const partOk = !partVal || String(r.part_number) === partVal;
            return groupOk && partOk;
        });

        const tbody = document.getElementById('dataBody');
        tbody.innerHTML = filtered.map(r => `
            <tr>
                <td>${r.name || '-'}</td>
                <td>${r.user_group || '-'}</td>
                <td>${r.insurance_type || ''} (ข้อ ${r.part_number ?? '-'})</td>
                <td style="max-width:250px;">${(r.question_text || '').slice(0, 60)}${(r.question_text||'').length>60?'...':''}</td>
                <td><audio controls src="${r.audio_url}"></audio></td>
                <td><a class="small-link" href="${r.audio_url}" download target="_blank">ดาวน์โหลด</a></td>
            </tr>
        `).join('');

        document.getElementById('countLabel').textContent = `แสดง ${filtered.length} จาก ${allRows.length} รายการ`;
        window._filteredRows = filtered;
    };

    window.downloadAllZip = async function() {
        const rows = window._filteredRows || allRows;
        if (rows.length === 0) {
            alert('ไม่มีไฟล์ให้ดาวน์โหลด');
            return;
        }
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.textContent = `กำลังรวมไฟล์ (0/${rows.length})...`;

        const zip = new JSZip();
        let done = 0;

        for (const r of rows) {
            try {
                const res = await fetch(r.audio_url);
                const blob = await res.blob();
                const safeName = `${r.user_group || 'unknown'}_${r.part_number ?? 'x'}_${r.id}`
                    .replace(/[^a-zA-Z0-9ก-๙_-]/g, '_');
                zip.file(`${safeName}.webm`, blob);
            } catch (e) {
                console.error('ข้ามไฟล์ที่ดาวน์โหลดไม่ได้:', r.audio_url, e);
            }
            done++;
            statusMsg.textContent = `กำลังรวมไฟล์ (${done}/${rows.length})...`;
        }

        statusMsg.textContent = 'กำลังสร้างไฟล์ ZIP...';
        const content = await zip.generateAsync({ type: 'blob' });

        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = `voice_hd_submissions_${Date.now()}.zip`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        statusMsg.textContent = `✅ ดาวน์โหลด ZIP สำเร็จ (${rows.length} ไฟล์)`;
    };
</script>
</body>
</html>
